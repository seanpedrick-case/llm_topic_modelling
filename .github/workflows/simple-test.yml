name: Simple Test Run

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements_lightweight.txt
        pip install pytest pytest-cov
    
    - name: Verify example data files
      run: |
        echo "Checking if example data directory exists:"
        ls -la example_data/ || echo "example_data directory not found"
        echo "Checking for specific CSV files:"
        ls -la example_data/*.csv || echo "No CSV files found"
        # Fail early if Git LFS pointers were not materialized
        if head -n 1 example_data/combined_case_notes.csv | grep -q 'git-lfs.github.com'; then
          echo "ERROR: example_data CSVs are still Git LFS pointers. Ensure checkout uses lfs: true."
          exit 1
        fi
    
    - name: Run CLI and GUI tests
      run: |
        cd test
        python run_tests.py
    
    - name: Run tests with pytest
      run: |
        pytest test/test.py test/test_gui_only.py -v --tb=short

